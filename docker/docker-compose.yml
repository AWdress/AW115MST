version: '3.8'

services:
  aw115mst:
    image: awdress/aw115mst:latest
    container_name: AW115MST
    volumes:
      # 配置文件（需可写：--login 扫码登录会把新 cookie 写回此目录）
      - ../config:/app/config:rw
      # 工作目录
      - ../待检测:/app/待检测
      - ../可秒传:/app/可秒传
      - ../待秒传:/app/待秒传
      - ../logs:/app/logs
      # 数据目录（断点续传和重新检测记录）
      - ../data:/app/data
    environment:
      - TZ=Asia/Shanghai
    restart: unless-stopped

